[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./out" }]

[rpc_endpoints]
sepolia = "${ETH_SEPOLIA_RPC_URL}"

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
corpus_dir = "cache/invariant-corpus"

[profile.soak.fuzz]
runs = 65536

[profile.soak.invariant]
runs = 4096
depth = 256

[profile.ffi]
ffi = true

[profile.ffi.fuzz]
runs = 256

[fmt]
line_length = 110
