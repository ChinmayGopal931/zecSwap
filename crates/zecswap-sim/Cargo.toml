[package]
name = "zecswap-sim"
description = "Deterministic simulation of whole swaps: the real client against a simulated chain, maker and relayer, from one seed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
alloy = { version = "1.8", default-features = false, features = [
    "consensus",
    "contract",
    "eips",
    "json-rpc",
    "k256",
    "network",
    "providers",
    "rpc-types",
    "signer-local",
    "sol-types",
    "std",
] }
anyhow = "1"
ark-bn254 = "0.5"
ark-ff = "0.5"
bytes = "1"
curve25519-dalek = "4"
h2 = "0.4"
hex = "0.4"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
light-poseidon = "0.4"
orchard = { workspace = true, features = ["circuit"] }
pczt = { workspace = true, features = ["io-finalizer", "prover", "spend-finalizer", "tx-extractor", "zcp-builder"] }
prost = "0.14"
rand.workspace = true
rand_chacha = "0.10"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
revm = { version = "43", default-features = false, features = [
    "optional_balance_check",
    "optional_no_base_fee",
    "portable",
    "secp256k1",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
tonic = { version = "0.14", default-features = false, features = ["channel"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
zcash_address.workspace = true
zcash_client_backend = { version = "0.25.0", features = ["lightwalletd-tonic", "orchard"] }
zcash_keys = { version = "0.17.0", features = ["orchard"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "0.31.0"
zcash_protocol.workspace = true
zecswap-api = { path = "../zecswap-api" }
zecswap-chain = { path = "../zecswap-chain", features = ["sim"] }
zecswap-cli = { path = "../zecswap-cli", features = ["sim"] }
zecswap-client = { path = "../zecswap-client", features = ["sim"] }
zecswap-core = { path = "../zecswap-core" }
zecswap-railgun = { path = "../zecswap-railgun" }
zecswap-sim-evm = { path = "../zecswap-sim-evm" }
zip32 = "0.3"
